# =============================================================================
# Snap Package — build, (install-check) and publish via the canonical reusable
# workflow. The end-to-end integration test lives in snap-test.yaml.
#
# Branch push -> jazzy/edge, tag push -> jazzy/candidate. PRs build+test only.
# Promotion jazzy/candidate -> jazzy/stable lives in snap-promote.yaml.
#
# SETUP: store the credentials from
#   snapcraft export-login --snaps pj-bridge --channels edge,candidate -
# as the SNAPSTORE_LOGIN repository secret.
# =============================================================================

name: Snap Package

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snap:
    permissions:
      contents: read
    uses: canonical/robotics-actions-workflows/.github/workflows/snap.yaml@main
    secrets:
      snapstore-login: ${{ secrets.SNAPSTORE_LOGIN }}
    with:
      snap-track: jazzy
      # The reusable test step installs the snap and runs `snapcraft info` on it.
      # The full end-to-end test runs separately in snap-test.yaml.
